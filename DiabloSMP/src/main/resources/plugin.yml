name: DiabloSMP
version: '1.0.0'
main: com.diablo.smp.DiabloPlugin
api-version: '1.21'
authors: [DiabloDev]
description: The Ultimate Boss Pack for Angel SMP

commands:
  diablo:
    description: Main admin command for DiabloSMP
    usage: "/diablo <give|remove|info|reload> [args]"
    permission: diablo.admin
  trust:
    description: Initiate a secure trade window for Soul Books
    usage: "/trust <player>"
    permission: diablo.trust

permissions:
  diablo.admin:
    description: Full access to plugin commands
    default: op
  diablo.trust:
    description: Ability to use trust system
    default: true
